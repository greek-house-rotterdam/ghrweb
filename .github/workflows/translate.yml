name: Content Pipeline

# Runs on every save, drafts included: `translate` and `verify` are required
# checks, so they must report on each new commit. Label changes (Decap status
# changes) don't add commits, so they don't need a run.
#
# Also handles images in public/images/: the translate job shrinks oversized
# ones and the verify job blocks ones the site can't use.
#
# The job ids `translate` and `verify` are the required check names in the
# `main-protected` ruleset, and the verify job posts statuses under those
# names. Renaming a job (or giving it a `name:`) blocks every PR until the
# ruleset is updated to match.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A newer save supersedes a run still in progress. The new run translates
# everything that differs from main, so nothing is lost.
concurrency:
  group: translate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No token rights by default: each job asks for what it needs.
permissions: {}

# Used by pr_status.py, which keeps the PR's one status comment up to date
# and @-mentions the admins when something fails.
env:
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ADMIN_MENTIONS: ${{ vars.ADMIN_MENTIONS || '@PanoEvJ' }}

jobs:
  translate:
    # Only run on PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write       # pushes the translations
      pull-requests: write  # the status comment (pr_status.py)
    outputs:
      new_sha: ${{ steps.push-translations.outputs.new_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Detect and translate changed content
        id: translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # translate.py lists translations it kept (corrected by hand) here,
          # and says why it failed when an editor can understand the reason
          KEPT_REPORT: /tmp/kept.md
          TRANSLATE_REPORT: /tmp/translate_failure.json
        run: |
          git fetch origin main
          git config core.quotePath false

          echo "=== Added/Changed files ==="
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/changed.txt || true
          cat /tmp/changed.txt

          if [ -s /tmp/changed.txt ]; then
            echo "Translating..."
            xargs -d '\n' python .github/scripts/translate.py < /tmp/changed.txt
          else
            echo "No content files to translate."
          fi

          echo ""
          echo "=== Deleted files ==="
          git diff --name-only --diff-filter=D origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/deleted.txt || true
          cat /tmp/deleted.txt

          if [ -s /tmp/deleted.txt ]; then
            echo "Syncing deletions..."
            xargs -d '\n' python .github/scripts/sync_deletions.py < /tmp/deleted.txt
          else
            echo "No content files deleted."
          fi

      # Information, not a failure: translations corrected by hand were kept
      # when the Greek changed. Recorded before the push, so a run cancelled
      # mid-way still leaves it (the next run flags the file again, and the
      # lists merge). Later runs never clear it: they wouldn't flag the file
      # again, because its source_hash is current by then.
      - name: Record kept translations
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_status.py kept --file /tmp/kept.md

      # Shrinks oversized images in place (same name and format). This runs
      # here, not in its own workflow, so the result lands in the same bot
      # commit as the translations: a second bot commit would become the PR
      # head without `translate`/`verify` statuses and block publishing.
      # Problems it can't fix are reported by the verify job.
      - name: Optimize changed images
        id: optimize
        run: |
          git config core.quotePath false
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'public/images/' > /tmp/changed_images.txt
          cat /tmp/changed_images.txt
          if [ -s /tmp/changed_images.txt ]; then
            xargs -d '\n' python .github/scripts/image_qa.py --fix < /tmp/changed_images.txt
          else
            echo "No images changed."
          fi

      - name: Commit and push translations and images
        id: push-translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ public/images/
          # shown in the status comment
          git diff --staged --name-only -- src/content/ > /tmp/written.txt

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "new_sha=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-translate content and optimize images"
            # The editor may have saved again meanwhile. That save starts a
            # new run, which redoes this work on the newer content.
            git pull --rebase origin "${{ github.head_ref }}"
            git push
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # !cancelled(): a failed run reports too, a superseded one does not.
      - name: Update the status comment
        if: ${{ !cancelled() }}
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ steps.translate.outcome }}" = "success" ] \
             && [ "${{ steps.optimize.outcome }}" = "success" ] \
             && [ "${{ steps.push-translations.outcome }}" = "success" ]; then
            NOTHING=""
            if [ ! -s /tmp/changed.txt ] && [ ! -s /tmp/deleted.txt ]; then NOTHING="--nothing"; fi
            python3 .github/scripts/pr_status.py translation --state ok --sha "$SHA" \
              --written /tmp/written.txt $NOTHING
          else
            python3 .github/scripts/pr_status.py translation --state fail --sha "$SHA" \
              --report /tmp/translate_failure.json
          fi

  verify:
    needs: translate
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      statuses: write       # translate/verify/review statuses on the bot commit
      pull-requests: write  # the status comment (pr_status.py)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Verify content integrity
        id: content
        env:
          VERIFY_REPORT: /tmp/missing.md
        run: python .github/scripts/verify_content.py

      # Blocks publishing for an image the site can't use: wrong format,
      # unreadable, or still over 5 MB after the translate job shrank it.
      # !cancelled(): also runs when the content check failed, so both
      # problems are reported at once.
      - name: Check images
        id: images
        if: ${{ !cancelled() }}
        run: |
          git fetch origin main
          git config core.quotePath false
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'public/images/' > /tmp/changed_images.txt
          cat /tmp/changed_images.txt
          if [ -s /tmp/changed_images.txt ]; then
            xargs -d '\n' python .github/scripts/image_qa.py --report /tmp/image_problems.md < /tmp/changed_images.txt
          else
            echo "No images changed."
          fi

      - name: Report status on auto-commit
        if: ${{ needs.translate.outputs.new_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEW_SHA: ${{ needs.translate.outputs.new_sha }}
        run: |
          # 'translate' and 'verify' ran in *this* workflow and produced NEW_SHA,
          # so posting success on the bot's commit reflects what actually happened.
          for context in translate verify; do
            gh api "repos/$REPO/statuses/$NEW_SHA" \
              -f state=success \
              -f context="$context" \
              -f description="Passed (via auto-translation workflow)"
          done

          # GitHub's GITHUB_TOKEN recursion prevention blocks Content Review from
          # re-triggering on the bot's commit. Carry forward the conclusion from
          # the parent (human-authored) commit instead of synthesizing success.
          PARENT_SHA=$(gh api "repos/$REPO/commits/$NEW_SHA" --jq '.parents[0].sha')

          # Content Review runs in parallel with this workflow — poll briefly.
          for attempt in 1 2 3 4 5 6; do
            REVIEW_CONCLUSION=$(gh api "repos/$REPO/commits/$PARENT_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name=="review")] | .[0].conclusion // empty')
            if [ -n "$REVIEW_CONCLUSION" ]; then
              break
            fi
            echo "Review check not yet concluded on $PARENT_SHA (attempt $attempt) — waiting 10s..."
            sleep 10
          done

          case "$REVIEW_CONCLUSION" in
            success|neutral|skipped)            STATE=success ;;
            failure|timed_out|action_required)  STATE=failure ;;
            cancelled)                          STATE=error ;;
            "")
              echo "No 'review' check found on $PARENT_SHA — skipping carry-forward."
              exit 0
              ;;
            *) STATE=success ;;
          esac

          gh api "repos/$REPO/statuses/$NEW_SHA" \
            -f state="$STATE" \
            -f context=review \
            -f description="Carried forward from ${PARENT_SHA:0:7} (translations not separately reviewed)"

      # Each result replaces its section of the status comment, so a failure
      # clears itself when a later run passes. The translation section is only
      # touched here when the content check fails; a pass was reported by the
      # translate job.
      - name: Update the status comment
        if: ${{ !cancelled() }}
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ steps.content.outcome }}" = "failure" ]; then
            python3 .github/scripts/pr_status.py translation --state fail --sha "$SHA" \
              --missing /tmp/missing.md
          fi
          if [ "${{ steps.images.outcome }}" = "failure" ]; then
            python3 .github/scripts/pr_status.py images --state fail --sha "$SHA" \
              --problems /tmp/image_problems.md
          elif [ "${{ steps.images.outcome }}" = "success" ]; then
            COUNT=0
            if [ -f /tmp/changed_images.txt ]; then COUNT=$(grep -c . /tmp/changed_images.txt || true); fi
            python3 .github/scripts/pr_status.py images --state ok --sha "$SHA" --count "$COUNT"
          fi
