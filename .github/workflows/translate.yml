name: Content Pipeline

# Runs on every save, drafts included: `translate` and `verify` are required
# checks, so they must report on each new commit. Label changes (Decap status
# changes) don't add commits, so they don't need a run.
#
# Also handles images in public/images/: the translate job shrinks oversized
# ones and the verify job blocks ones the site can't use.
#
# The job ids `translate` and `verify` are the required check names in the
# `main-protected` ruleset, and the verify job posts statuses under those
# names. Renaming a job (or giving it a `name:`) blocks every PR until the
# ruleset is updated to match.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A newer save supersedes a run still in progress. The new run translates
# everything that differs from main, so nothing is lost.
concurrency:
  group: translate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No token rights by default: each job asks for what it needs.
permissions: {}

# Used by pr_status.py, which keeps the PR's one status comment up to date
# and @-mentions the admins when something fails.
env:
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ADMIN_MENTIONS: ${{ vars.ADMIN_MENTIONS || '@PanoEvJ' }}

jobs:
  translate:
    # Only run on PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write       # pushes the translations
      pull-requests: write  # the status comment (pr_status.py)
    outputs:
      new_sha: ${{ steps.push-translations.outputs.new_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Detect and translate changed content
        id: translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # translate.py lists translations it kept (corrected by hand) here,
          # and says why it failed when an editor can understand the reason
          KEPT_REPORT: /tmp/kept.md
          TRANSLATE_REPORT: /tmp/translate_failure.json
        run: |
          git fetch origin main
          git config core.quotePath false

          # Deletions first: a deleted Greek file removes its translations; a
          # deleted translation (Greek still there) is written again below.
          echo "=== Deleted files ==="
          git diff --name-only --diff-filter=D origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/deleted.txt || true
          cat /tmp/deleted.txt
          : > /tmp/retranslate.txt
          if [ -s /tmp/deleted.txt ]; then
            xargs -d '\n' python .github/scripts/sync_deletions.py --retranslate-to /tmp/retranslate.txt < /tmp/deleted.txt
          else
            echo "No content files deleted."
          fi

          echo ""
          echo "=== Added/Changed files ==="
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/changed.txt || true
          # Plus the Greek files whose translation was deleted.
          cat /tmp/retranslate.txt >> /tmp/changed.txt
          sort -u -o /tmp/changed.txt /tmp/changed.txt
          cat /tmp/changed.txt

          if [ -s /tmp/changed.txt ]; then
            echo "Translating..."
            xargs -d '\n' python .github/scripts/translate.py < /tmp/changed.txt
          else
            echo "No content files to translate."
          fi

      # Information, not a failure: translations corrected by hand were kept
      # when the Greek changed. Recorded before the push, so a run cancelled
      # mid-way still leaves it (the next run flags the file again, and the
      # lists merge). Later runs never clear it: they wouldn't flag the file
      # again, because its source_hash is current by then.
      - name: Record kept translations
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_status.py kept --file /tmp/kept.md

      # Shrinks oversized images in place (same name and format). This runs
      # here, not in its own workflow, so the result lands in the same bot
      # commit as the translations: a second bot commit would become the PR
      # head without `translate`/`verify` statuses and block publishing.
      # Problems it can't fix are reported by the verify job.
      - name: Optimize changed images
        id: optimize
        run: |
          git config core.quotePath false
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'public/images/' > /tmp/changed_images.txt
          cat /tmp/changed_images.txt
          if [ -s /tmp/changed_images.txt ]; then
            xargs -d '\n' python .github/scripts/image_qa.py --fix < /tmp/changed_images.txt
          else
            echo "No images changed."
          fi

      - name: Commit and push translations and images
        id: push-translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ public/images/
          # shown in the status comment
          git diff --staged --name-only -- src/content/ > /tmp/written.txt

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "new_sha=" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-translate content and optimize images"
            # The editor may have saved again meanwhile. That save starts a
            # new run, which redoes this work on the newer content.
            git pull --rebase origin "${{ github.head_ref }}"
            git push
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # !cancelled(): a failed run reports too, a superseded one does not.
      - name: Update the status comment
        if: ${{ !cancelled() }}
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
          # Links to correct the draft's Dutch and English files on GitHub
          # before publishing (#131). Environment variables, not options: an
          # older branch runs its own older pr_status.py, which ignores them.
          HEAD_REF: ${{ github.head_ref }}
          CHANGED_FILES: /tmp/changed.txt
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ steps.translate.outcome }}" = "success" ] \
             && [ "${{ steps.optimize.outcome }}" = "success" ] \
             && [ "${{ steps.push-translations.outcome }}" = "success" ]; then
            NOTHING=""
            if [ ! -s /tmp/changed.txt ] && [ ! -s /tmp/deleted.txt ]; then NOTHING="--nothing"; fi
            python3 .github/scripts/pr_status.py translation --state ok --sha "$SHA" \
              --written /tmp/written.txt $NOTHING
          else
            python3 .github/scripts/pr_status.py translation --state fail --sha "$SHA" \
              --report /tmp/translate_failure.json
          fi

  # The automatic tests that read the real content (src/content, src/data) run
  # here too, after the bot's commit, so a content edit that breaks one shows
  # up on the pull request that caused it (it happened with #88 and #90). They
  # can't run in the Tests workflow on content pull requests: there they would
  # check the editor's commit, before the translations exist.
  #
  # Not a required check: a broken test is the developer's problem, never the
  # editor's, so it doesn't block publishing. `report-content-tests` tells the
  # admins instead. Read-only token: this job installs packages and runs code.
  content-tests:
    needs: [translate, verify]
    # Never for forks (translate already refuses them; this repeats it here).
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && needs.translate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}  # includes the bot's commit, if any

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Keep this list to the tests that read real content. Each one checks the
      # shape of the content, never today's values (see the tests' comments).
      - name: Content tests (Node)
        run: npx vitest run src/__tests__/site-settings.test.ts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv export --no-hashes --extra test | uv pip install --system -r -

      - name: Content tests (Python)
        run: pytest -v .github/scripts/tests/test_content_hashes.py

  # Opens (or adds to) one issue for the admins when the content tests fail.
  # Separate job with no code checkout: only the `gh` calls below use its
  # `issues: write` token.
  report-content-tests:
    needs: content-tests
    if: ${{ failure() && needs.content-tests.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TITLE: The content tests failed
      ADMIN_MENTIONS: ${{ vars.ADMIN_MENTIONS || '@PanoEvJ' }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          body=$(cat <<EOF
          $ADMIN_MENTIONS The tests that read the site's content failed on $PR_URL.

          If that pull request only changes content (for example a save in /admin), the text is probably fine: usually a test expects something about the content that is no longer true. Fix the test (check the content's shape, not its current values), or the content if it really is wrong. If it changes code, the code may have broken the test.

          - Run: $RUN_URL

          This doesn't block publishing. Close this issue when it's fixed.
          EOF
          )
          num=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

  verify:
    needs: translate
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      statuses: write       # translate/verify/review/ai-gate statuses on the bot commit
      pull-requests: write  # the status comment (pr_status.py)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Verify content integrity
        id: content
        env:
          VERIFY_REPORT: /tmp/missing.md
        run: python .github/scripts/verify_content.py

      # Blocks publishing for an image the site can't use: wrong format,
      # unreadable, or still over 5 MB after the translate job shrank it.
      # !cancelled(): also runs when the content check failed, so both
      # problems are reported at once.
      - name: Check images
        id: images
        if: ${{ !cancelled() }}
        run: |
          git fetch origin main
          git config core.quotePath false
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'public/images/' > /tmp/changed_images.txt
          cat /tmp/changed_images.txt
          if [ -s /tmp/changed_images.txt ]; then
            xargs -d '\n' python .github/scripts/image_qa.py --report /tmp/image_problems.md < /tmp/changed_images.txt
          else
            echo "No images changed."
          fi

      # Blocks publishing for a Greek event text that belongs to no event in
      # the live site's list, to an event that already has Greek text, or
      # whose event was changed after it was created (#105). Old entries the
      # PR doesn't touch are not checked. If the list can't be read, it warns
      # and lets the post through.
      - name: Check events
        id: events
        if: ${{ !cancelled() }}
        run: |
          git fetch origin main
          git config core.quotePath false
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/event-translations/gr/' > /tmp/changed_events.txt
          cat /tmp/changed_events.txt
          # A branch made before this check has no script: skip it there.
          if [ -s /tmp/changed_events.txt ] && [ -f .github/scripts/check_event_ids.py ]; then
            xargs -d '\n' python .github/scripts/check_event_ids.py --report /tmp/event_check.json < /tmp/changed_events.txt
          else
            echo "No Greek event texts changed."
          fi

      - name: Report status on auto-commit
        if: ${{ needs.translate.outputs.new_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEW_SHA: ${{ needs.translate.outputs.new_sha }}
        run: |
          # 'translate' and 'verify' ran in *this* workflow and produced NEW_SHA,
          # so posting success on the bot's commit reflects what actually happened.
          for context in translate verify; do
            gh api "repos/$REPO/statuses/$NEW_SHA" \
              -f state=success \
              -f context="$context" \
              -f description="Passed (via auto-translation workflow)"
          done

          # GitHub's GITHUB_TOKEN recursion prevention blocks Content Review from
          # re-triggering on the bot's commit. Carry forward the conclusion from
          # the parent (human-authored) commit instead of synthesizing success.
          PARENT_SHA=$(gh api "repos/$REPO/commits/$NEW_SHA" --jq '.parents[0].sha')

          # ai-gate, required: holds a post with a critical AI remark. Content
          # Review posts it on the parent, and on this commit if it finishes
          # after this one exists. If it finished first, copy it here. Poll
          # briefly; if it's still running, it posts here itself.
          GATE=""
          for attempt in 1 2 3 4 5 6; do
            GATE=$(gh api "repos/$REPO/commits/$PARENT_SHA/status" \
              --jq '[.statuses[] | select(.context=="ai-gate")][0] // empty | "\(.state)\t\(.description)"' || true)
            if [ -n "$GATE" ]; then
              break
            fi
            echo "No ai-gate on $PARENT_SHA yet (attempt $attempt) — waiting 10s..."
            sleep 10
          done
          if [ -n "$GATE" ]; then
            IFS=$'\t' read -r GATE_STATE GATE_DESCRIPTION <<< "$GATE"
            gh api "repos/$REPO/statuses/$NEW_SHA" \
              -f state="$GATE_STATE" \
              -f context=ai-gate \
              -f description="$GATE_DESCRIPTION"
          else
            echo "No ai-gate on $PARENT_SHA yet: Content Review posts it on $NEW_SHA when it finishes."
          fi

          # Content Review runs in parallel with this workflow — poll briefly.
          for attempt in 1 2 3 4 5 6; do
            REVIEW_CONCLUSION=$(gh api "repos/$REPO/commits/$PARENT_SHA/check-runs" \
              --jq '[.check_runs[] | select(.name=="review")] | .[0].conclusion // empty')
            if [ -n "$REVIEW_CONCLUSION" ]; then
              break
            fi
            echo "Review check not yet concluded on $PARENT_SHA (attempt $attempt) — waiting 10s..."
            sleep 10
          done

          case "$REVIEW_CONCLUSION" in
            success|neutral|skipped)            STATE=success ;;
            failure|timed_out|action_required)  STATE=failure ;;
            cancelled)                          STATE=error ;;
            "")
              echo "No 'review' check found on $PARENT_SHA — skipping carry-forward."
              exit 0
              ;;
            *) STATE=success ;;
          esac

          gh api "repos/$REPO/statuses/$NEW_SHA" \
            -f state="$STATE" \
            -f context=review \
            -f description="Carried forward from ${PARENT_SHA:0:7} (translations not separately reviewed)"

      # Each result replaces its section of the status comment, so a failure
      # clears itself when a later run passes. The translation section is only
      # touched here when the content check fails; a pass was reported by the
      # translate job.
      - name: Update the status comment
        if: ${{ !cancelled() }}
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ steps.content.outcome }}" = "failure" ]; then
            python3 .github/scripts/pr_status.py translation --state fail --sha "$SHA" \
              --missing /tmp/missing.md
          fi
          if [ "${{ steps.images.outcome }}" = "failure" ]; then
            python3 .github/scripts/pr_status.py images --state fail --sha "$SHA" \
              --problems /tmp/image_problems.md
          elif [ "${{ steps.images.outcome }}" = "success" ]; then
            COUNT=0
            if [ -f /tmp/changed_images.txt ]; then COUNT=$(grep -c . /tmp/changed_images.txt || true); fi
            python3 .github/scripts/pr_status.py images --state ok --sha "$SHA" --count "$COUNT"
          fi
          if [ -f /tmp/event_check.json ]; then
            python3 .github/scripts/pr_status.py events --sha "$SHA" --report /tmp/event_check.json
          fi

  # The bot's commit should not start these workflows again: the verify job
  # already reports translate, verify and review on it. GitHub does create
  # runs for it, then holds them for approval, because this repository requires
  # approval for every outside contributor and the bot isn't a collaborator.
  # Approving them would only repeat the work, so delete them and the "workflows
  # awaiting approval" box goes away. Only the bot's own held runs on its own
  # commit are touched. Never a blocker: the pull request is green without it.
  # The job checks out no code and runs no third-party actions: its token,
  # with `actions: write`, is only used by the `gh api` calls below.
  tidy:
    needs: translate
    # Never for forks (translate already refuses them; this repeats it here).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.translate.outputs.new_sha != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write  # delete the held runs
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NEW_SHA: ${{ needs.translate.outputs.new_sha }}
    steps:
      - name: Delete the held runs on the bot's commit
        run: |
          # GitHub creates the runs a few seconds after the push, not all at once.
          deleted=0
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 15
            ids=$(gh api "repos/$REPO/actions/runs?head_sha=$NEW_SHA&per_page=50" --jq '
              .workflow_runs[]
              | select(.conclusion == "action_required")
              | select(.triggering_actor.login == "github-actions[bot]")
              | .id')
            if [ -z "$ids" ]; then
              # Stop once a round finds nothing after something was deleted.
              [ "$deleted" -gt 0 ] && break
              continue
            fi
            for id in $ids; do
              if gh api -X DELETE "repos/$REPO/actions/runs/$id"; then
                deleted=$((deleted + 1))
                echo "Deleted held run $id"
              else
                echo "::warning title=Held run::Could not delete run $id"
              fi
            done
          done
          echo "Deleted $deleted held run(s) on $NEW_SHA."

  # The preview link for /admin's Preview badge and the status comment (#127).
  # Waits for Cloudflare's "Workers Builds: ghrweb" check run on the PR's final
  # head (the bot's commit, if it pushed one) and posts its URL as the
  # `deploy/preview` status. preview-status.yml does the same from
  # Cloudflare's PR comment, as a fallback: that comment can come late or not
  # at all. Not a required check; a newer save cancels this run.
  preview:
    needs: translate
    # Never for forks (translate already refuses them; this repeats it here).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.translate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read        # checkout
      checks: read          # Cloudflare's check run
      statuses: write       # deploy/preview
      pull-requests: write  # the status comment (pr_status.py)
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post the preview link from Cloudflare's build
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.translate.outputs.new_sha || github.event.pull_request.head.sha }}
        run: python .github/scripts/preview_status.py check-run
