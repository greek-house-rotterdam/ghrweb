name: Image QA

# Runs on every save, drafts included. Label changes (Decap status changes)
# don't add commits, so they don't need a run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "public/images/**"

# A newer save supersedes a run still in progress. The new run checks every
# image that differs from main, so nothing is lost.
concurrency:
  group: image-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  image-qa:
    # Only run on PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Find changed images
        id: changed
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'public/images/' > /tmp/changed_images.txt
          cat /tmp/changed_images.txt
          if [ -s /tmp/changed_images.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and optimize images
        if: steps.changed.outputs.has_changes == 'true'
        run: xargs -d '\n' python .github/scripts/image_qa.py < /tmp/changed_images.txt

      - name: Commit optimized images
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/

          if git diff --staged --quiet; then
            echo "No images were optimized."
          else
            git commit -m "chore: auto-optimize images"
            # Translation may have pushed to this branch meanwhile; it only
            # touches src/content/, so the rebase can't conflict.
            git pull --rebase origin "${{ github.head_ref }}"
            git push
          fi
