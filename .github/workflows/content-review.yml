name: Content Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]
    paths:
      - "src/content/**/*.md"

permissions:
  contents: read
  pull-requests: write

# Used by pr_notice.py, which tells the editor and admins when this fails.
env:
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ADMIN_MENTIONS: ${{ vars.ADMIN_MENTIONS || '@PanoEvJ' }}

jobs:
  review:
    # Only run on PRs from the same repository
    # Skip draft PRs from Decap CMS — only run when editor moves to "In Review"
    if: github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'decap-cms/draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Find changed content files
        id: changed
        run: |
          git fetch origin main

          if [ "${{ github.event.action }}" = "opened" ]; then
            # PR just opened — review all new content in the PR
            echo "PR opened: reviewing all content changes vs main"
            git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/changed_content.txt || true
          else
            # synchronize (new push) — only review files changed in this push,
            # not the full PR. This avoids re-reviewing auto-translated files
            # and previously reviewed content.
            echo "New push: reviewing only files in ${{ github.event.before }}..${{ github.event.after }}"
            git diff --name-only --diff-filter=ACM ${{ github.event.before }}..${{ github.event.after }} -- 'src/content/' | grep '\.md$' > /tmp/changed_content.txt || true
          fi

          cat /tmp/changed_content.txt
          if [ -s /tmp/changed_content.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI content review
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_OUTPUT: /tmp/content-review.json
        run: xargs -d '\n' python .github/scripts/content_review.py < /tmp/changed_content.txt

      # always(): the review step fails when a file couldn't be reviewed, and
      # its "review unavailable" comments must still be posted.
      - name: Post PR comments
        if: always() && steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          REVIEW_FILE="/tmp/content-review.json"
          if [ ! -f "$REVIEW_FILE" ] || [ "$(cat "$REVIEW_FILE")" = "[]" ]; then
            echo "No comments to post."
            exit 0
          fi

          # Post one comment per file. Comments embed a `<!-- content-review:<path> -->`
          # marker so we can find and delete prior comments for the same file
          # before posting a new one — keeps the PR clean across re-runs.
          python3 <<'PYEOF'
          import json, os, subprocess

          with open('/tmp/content-review.json') as f:
              results = json.load(f)

          repo = os.environ['REPO']
          pr = os.environ['PR_NUMBER']

          findings_footer = '\n\n---\n*Automated review by Gemini Flash — advisory only, does not block merge.*'
          error_footer = '\n\n---\n*Automated review by Gemini Flash — the site admin has been notified.*'

          # Snapshot existing comments once so we don't re-fetch per file.
          existing = json.loads(subprocess.run(
              ['gh', 'api', f'repos/{repo}/issues/{pr}/comments', '--paginate'],
              capture_output=True, text=True, check=True,
          ).stdout)

          def delete_prior(file_path: str) -> int:
              marker = f'<!-- content-review:{file_path} -->'
              ids = [c['id'] for c in existing if marker in (c.get('body') or '')]
              for cid in ids:
                  subprocess.run(['gh', 'api', '-X', 'DELETE',
                                  f'repos/{repo}/issues/comments/{cid}', '--silent'],
                                 check=False)
              return len(ids)

          for result in results:
              if result.get('error'):
                  comment = result['comment'] + error_footer
                  label = 'unavailable'
              elif result.get('findings'):
                  comment = result['comment'] + findings_footer
                  label = 'findings'
              else:
                  continue

              file_path = result['file']
              n_deleted = delete_prior(file_path)
              if n_deleted:
                  print(f'Replaced {n_deleted} prior comment(s) for {file_path}')

              subprocess.run(
                  ['gh', 'pr', 'comment', pr, '--body', comment],
                  check=True,
              )
              print(f'Posted {label} comment for {file_path}')
          PYEOF

      - name: Tell the editor and admins
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_notice.py set review

      # A later run that succeeds removes the earlier failure notice.
      - name: Clear failure notice
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_notice.py clear review
