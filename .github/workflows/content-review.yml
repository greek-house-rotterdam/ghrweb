name: Content Review

# Runs on every save, drafts included. "opened" reviews all content in the PR;
# each later push reviews only the files it changed (see below). Label changes
# carry no push, so a "labeled" run had nothing to review.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - "src/content/**/*.md"

# One review per PR at a time: a newer save cancels the review still running
# for the previous one. (Updates to the status comment don't depend on this:
# pr_status.py re-reads and retries.)
concurrency:
  group: content-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Used by pr_status.py, which puts the review into the PR's one status comment
# and @-mentions the admins when the review couldn't run.
env:
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  ADMIN_MENTIONS: ${{ vars.ADMIN_MENTIONS || '@PanoEvJ' }}

jobs:
  review:
    # Only run on PRs from the same repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv export --no-hashes | uv pip install --system -r -

      - name: Find changed content files
        id: changed
        run: |
          git fetch origin main
          # List Greek filenames as they are, not as quoted escapes
          # ("\316\272…md"), which the '\.md$' filter would silently drop.
          git config core.quotePath false

          if [ "${{ github.event.action }}" = "opened" ]; then
            # PR just opened — review all new content in the PR
            echo "PR opened: reviewing all content changes vs main"
            git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/' | grep '\.md$' > /tmp/changed_content.txt || true
          else
            # synchronize (new push) — review the files changed in this push.
            # A newer push cancels an in-progress review (see `concurrency`),
            # so also re-review the PR's human-authored files (no source_hash;
            # auto-translations carry one): the cancelled push's files are
            # then not lost. Re-posting replaces the earlier comment per file.
            echo "New push: reviewing files in ${{ github.event.before }}..${{ github.event.after }} plus the PR's source files"
            {
              git diff --name-only --diff-filter=ACM ${{ github.event.before }}..${{ github.event.after }} -- 'src/content/' | grep '\.md$' || true
              git diff --name-only --diff-filter=ACM origin/main...HEAD -- 'src/content/' | grep '\.md$' | while IFS= read -r f; do
                grep -q '^source_hash:' "$f" || echo "$f"
              done || true
            } | sort -u > /tmp/changed_content.txt
          fi

          cat /tmp/changed_content.txt
          if [ -s /tmp/changed_content.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI content review
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_OUTPUT: /tmp/content-review.json
        run: xargs -d '\n' python .github/scripts/content_review.py < /tmp/changed_content.txt

      # !cancelled(): the review step fails when a file couldn't be reviewed,
      # and that must still reach the status comment. A review cancelled by a
      # newer save reports nothing; the next run covers its files.
      - name: Update the status comment
        if: ${{ !cancelled() && steps.changed.outputs.has_changes == 'true' }}
        continue-on-error: true  # the comment is a courtesy, never a blocker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pr_status.py review --sha "$(git rev-parse HEAD)" \
            --reviewed /tmp/changed_content.txt --results /tmp/content-review.json
