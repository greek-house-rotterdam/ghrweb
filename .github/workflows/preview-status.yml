name: Preview Status

# Gives Decap CMS its "View Preview" button. Decap reads a commit status whose
# context contains "deploy"; Cloudflare only posts a check-run and a PR comment.
# This copies the preview URL from Cloudflare's comment into a `deploy/preview`
# status on the PR head.
#
# This is the fallback (#127). The main path is the `preview` job in
# translate.yml, which waits for Cloudflare's check run after each save:
# Cloudflare's comment can come late (17 minutes on #125) or never (#121).
# Neither can listen for the check run itself: GitHub skips check_run /
# check_suite workflows when the commit was pushed by GitHub Actions, and the
# translation bot's commits are exactly that.
#
# issue_comment runs the workflow from the default branch, never from PR code.
# It checks out main only to get preview_status.py.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  statuses: write
  pull-requests: write  # edits the PR's status comment (pr_status.py)

concurrency:
  group: preview-status-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  status:
    # Only Cloudflare's own comment on a pull request.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'cloudflare-workers-and-pages[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post deploy/preview status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python .github/scripts/preview_status.py
