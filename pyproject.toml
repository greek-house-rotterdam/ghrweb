[project]
name = "ghrweb-scripts"
version = "0.1.0"
description = "Python dependencies for GHR website scripts (CI & local dev)"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
    "pyyaml>=6.0.3",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
# Local-only tooling used by .claude/skills/* (e.g. docx ingestion).
# Not installed in CI — keep CI deps minimal.
skills = [
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
testpaths = [".github/scripts/tests"]
pythonpath = [".github/scripts"]
