          - { label: "Κωδικός φόρμας επικοινωνίας / Contact form ID", name: "contact_form_id", widget: "string", required: false, pattern: ['^[A-Za-z0-9_-]*$', "Μόνο ο κωδικός της φόρμας, όχι ολόκληρος ο σύνδεσμος / Only the form ID, not the whole link"], hint: "Ο κωδικός είναι το κομμάτι του συνδέσμου ανάμεσα στο /d/e/ και στο /viewform. Αν μείνει κενός, η σελίδα Επικοινωνία δείχνει το email αντί για φόρμα. / The ID is the part of the link between /d/e/ and /viewform. If empty, the Contact page shows the email address instead of a form." }
