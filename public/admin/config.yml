        name: "category"
        widget: "select"
        options: ["legal", "healthcare", "education", "housing", "finance", "culture", "other"]
        default: "other"
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── history-sections, about-sections, and history-milestones are       ──
  # ── intentionally NOT exposed in Decap. They're programmatic-only       ──
  # ── collections (ingested via the content-pipeline skill from source    ──
  # ── docs). Editors manage the /history/<slug> detail pages, the         ──
  # ── /about/<slug> detail pages, and the timeline-milestone cards via    ──
  # ── PR, not via the admin UI. See src/content.config.ts for schemas.    ──
