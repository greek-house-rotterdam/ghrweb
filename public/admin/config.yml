# local_backend only activates on localhost — safe to leave on in production
local_backend: true

backend:
  name: github
  repo: greek-house-rotterdam/ghrweb
  branch: main
  base_url: https://ghrweb.enosi-ellinon-ollandias.workers.dev

publish_mode: editorial_workflow

media_folder: public/images
public_folder: /images

collections:
  # ── News ──────────────────────────────────────────────────────────

  - name: news-gr
    label: "Νέα (Ελληνικά)"
    folder: src/content/news/gr
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: news-nl
    label: "Nieuws (Nederlands)"
    folder: src/content/news/nl
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: news-en
    label: "News (English)"
    folder: src/content/news/en
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── Event translations (Ticket Tailor is the source of truth for dates,
  # ── location, prices, tickets — these collections only translate title/description/body.

  - name: event-translations-gr
    label: "Μεταφράσεις Εκδηλώσεων (Ελληνικά)"
    folder: src/content/event-translations/gr
    create: true
    slug: "{{tt_event_id}}"
    fields:
      - { label: "Ticket Tailor Event ID", name: "tt_event_id", widget: "string", hint: "Find it in the Ticket Tailor dashboard → Events → click event → copy the event ID, e.g. ev_8112397." }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional rich text shown on the detail page below the description." }

  - name: event-translations-nl
    label: "Vertalingen Evenementen (Nederlands)"
    folder: src/content/event-translations/nl
    create: true
    slug: "{{tt_event_id}}"
    fields:
      - { label: "Ticket Tailor Event ID", name: "tt_event_id", widget: "string", hint: "Find it in the Ticket Tailor dashboard → Events → click event → copy the event ID, e.g. ev_8112397." }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional rich text shown on the detail page below the description." }

  - name: event-translations-en
    label: "Event translations (English)"
    folder: src/content/event-translations/en
    create: true
    slug: "{{tt_event_id}}"
    fields:
      - { label: "Ticket Tailor Event ID", name: "tt_event_id", widget: "string", hint: "Find it in the Ticket Tailor dashboard → Events → click event → copy the event ID, e.g. ev_8112397." }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional rich text shown on the detail page below the description." }

  # ── Activities ────────────────────────────────────────────────────

  - name: activities-gr
    label: "Δραστηριότητες (Ελληνικά)"
    folder: src/content/activities/gr
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Emoji", name: "emoji", widget: "string", required: false, hint: "e.g. 💃 🎨 📚" }
      - { label: "Schedule", name: "schedule", widget: "string", required: false, hint: "e.g. 'Every Thursday 19:00'" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: activities-nl
    label: "Activiteiten (Nederlands)"
    folder: src/content/activities/nl
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Emoji", name: "emoji", widget: "string", required: false, hint: "e.g. 💃 🎨 📚" }
      - { label: "Schedule", name: "schedule", widget: "string", required: false, hint: "e.g. 'Elke donderdag 19:00'" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: activities-en
    label: "Activities (English)"
    folder: src/content/activities/en
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Emoji", name: "emoji", widget: "string", required: false, hint: "e.g. 💃 🎨 📚" }
      - { label: "Schedule", name: "schedule", widget: "string", required: false, hint: "e.g. 'Every Thursday 19:00'" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false, hint: "Check this if this is a hand-crafted translation that should not be regenerated when the source changes." }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── FAQ ───────────────────────────────────────────────────────────

  - name: faq-gr
    label: "Συχνές Ερωτήσεις (Ελληνικά)"
    folder: src/content/faq/gr
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }

  - name: faq-nl
    label: "Veelgestelde vragen (Nederlands)"
    folder: src/content/faq/nl
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }

  - name: faq-en
    label: "FAQ (English)"
    folder: src/content/faq/en
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }

  # ── Resources / Useful Information ────────────────────────────────

  - name: resources-gr
    label: "Χρήσιμες Πληροφορίες (Ελληνικά)"
    folder: src/content/resources/gr
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["legal", "healthcare", "education", "housing", "finance", "culture", "other"]
        default: "other"
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: resources-nl
    label: "Nuttige informatie (Nederlands)"
    folder: src/content/resources/nl
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["legal", "healthcare", "education", "housing", "finance", "culture", "other"]
        default: "other"
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: resources-en
    label: "Useful Information (English)"
    folder: src/content/resources/en
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Max 100 characters"] }
      - { label: "Description", name: "description", widget: "string", pattern: ['^.{0,200}$', "Max 200 characters"] }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["legal", "healthcare", "education", "housing", "finance", "culture", "other"]
        default: "other"
      - { label: "Display Order", name: "order", widget: "number", default: 100, hint: "Lower numbers appear first" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── history-sections and about-sections are intentionally NOT exposed ──
  # ── in Decap. They're programmatic-only collections (ingested via the   ──
  # ── content-pipeline skill from source docs). Editors manage the       ──
  # ── /history/<slug> and /about/<slug> detail pages via PR, not via the  ──
  # ── admin UI. See src/content.config.ts for the schema.                 ──

  # ── History timeline milestones ──

  - name: history-milestones-gr
    label: "Ορόσημα ιστορίας (Ελληνικά)"
    folder: src/content/history-milestones/gr
    create: true
    slug: "{{year}}"
    fields:
      - { label: "Year", name: "year", widget: "string", hint: "e.g. 1946, or a range like 1965-1971" }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,140}$', "Max 140 characters"] }
      - { label: "Linked section", name: "linkedSection", widget: "string", required: false, hint: "Optional: slug of a page-section (e.g. 'founding') to make this milestone clickable. The section must exist on /history." }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }

  - name: history-milestones-nl
    label: "Geschiedenis mijlpalen (Nederlands)"
    folder: src/content/history-milestones/nl
    create: true
    slug: "{{year}}"
    fields:
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,140}$', "Max 140 characters"] }
      - { label: "Linked section", name: "linkedSection", widget: "string", required: false }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false }
      - { label: "Language", name: "lang", widget: "hidden", default: "nl" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }

  - name: history-milestones-en
    label: "History milestones (English)"
    folder: src/content/history-milestones/en
    create: true
    slug: "{{year}}"
    fields:
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Title", name: "title", widget: "string", pattern: ['^.{0,140}$', "Max 140 characters"] }
      - { label: "Linked section", name: "linkedSection", widget: "string", required: false }
      - { label: "Lock translation (do not overwrite)", name: "translation_locked", widget: "boolean", default: false, required: false }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Body", name: "body", widget: "hidden", default: "" }
