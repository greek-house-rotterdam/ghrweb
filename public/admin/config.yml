  # ── history-sections, about-sections, and history-milestones are       ──
  # ── intentionally NOT exposed in Decap. They're programmatic-only       ──
  # ── collections (ingested via the content-pipeline skill from source    ──
  # ── docs). Editors manage the /history/<slug> detail pages, the         ──
  # ── /about/<slug> detail pages, and the timeline-milestone cards via    ──
  # ── PR, not via the admin UI. See src/content.config.ts for schemas.    ──

  # ── Site settings ─────────────────────────────────────────────────
  # One entry per file in src/data/. These are the same in every language, so
  # nothing is translated. Each save opens a pull request on the branch
  # cms/settings/<file name>. The checks are in src/lib/site-settings.ts; the
  # fields below must match that file (a test compares them).

  - name: settings
    label: "Ρυθμίσεις ιστότοπου"
    # No Publish button: Ready is the only way to publish (auto-publish waits
    # for translations and checks). The admin account may skip the ruleset,
    # so its Publish could merge before the translations exist.
    publish: false
    description: "Στοιχεία που είναι ίδια σε όλες τις γλώσσες: μέλη του Διοικητικού Συμβουλίου, στοιχεία επικοινωνίας και φόρμα επικοινωνίας. Δεν μεταφράζονται. Αν αφήσεις ένα πεδίο κενό, δεν εμφανίζεται στον ιστότοπο. / Facts that are the same in every language: board members, contact details and the contact form. They are not translated. A field left empty doesn't show on the site."
    editor: { preview: false }
    files:
      - name: board
        label: "Διοικητικό Συμβούλιο / Board"
        file: src/data/board.yml
        fields:
          - label: "Μέλη / Members"
            name: "members"
            widget: "list"
            summary: "{{fields.role}} · {{fields.name}}"
            hint: "Η σειρά εδώ είναι η σειρά στη σελίδα «Σχετικά». Η ονομασία του ρόλου μεταφράζεται αυτόματα στα ολλανδικά και στα αγγλικά. / The order here is the order on the About page. Role names are translated into Dutch and English automatically."
            fields:
              - label: "Ρόλος / Role"
                name: "role"
                widget: "select"
                options:
                  - { label: "Πρόεδρος / President", value: "president" }
                  - { label: "Αντιπρόεδρος / Vice-president", value: "vice_president" }
                  - { label: "Γραμματέας / Secretary", value: "secretary" }
                  - { label: "Ταμίας / Treasurer", value: "treasurer" }
                  - { label: "Μέλος Δ.Σ. / Board member", value: "member" }
                default: "member"
              - { label: "Ονοματεπώνυμο / Full name", name: "name", widget: "string", required: false, hint: "Αν μείνει κενό, η σελίδα δείχνει προσωρινά μόνο τον ρόλο. / If empty, the page shows only the role for now." }

      - name: contact
        label: "Στοιχεία επικοινωνίας / Contact details"
        file: src/data/contact.yml
        fields:
          - { label: "Διεύθυνση / Address", name: "address", widget: "string", required: false, hint: "Π.χ. Van Vollenhovenstraat 18, 3016 BH Rotterdam. Χρησιμοποιείται και για τον χάρτη. Αν μείνει κενό, κρύβονται η διεύθυνση και ο χάρτης. / E.g. Van Vollenhovenstraat 18, 3016 BH Rotterdam. Also used for the map. If empty, the address and the map are hidden." }
          - { label: "Email Ένωσης / Association email", name: "union_email", widget: "string", required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Γράψε μια έγκυρη διεύθυνση email / Enter a valid email address"], hint: "Αν μείνει κενό, δεν εμφανίζεται στη σελίδα Επικοινωνία. / If empty, it doesn't show on the Contact page." }
          - { label: "Email Ελληνικού Σπιτιού / Greek House email", name: "house_email", widget: "string", required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Γράψε μια έγκυρη διεύθυνση email / Enter a valid email address"], hint: "Εμφανίζεται και στη θέση της φόρμας όταν δεν υπάρχει φόρμα επικοινωνίας. / Also shown in place of the form when there is no contact form." }
          - { label: "Σύνδεσμος Instagram / Instagram link", name: "instagram_url", widget: "string", required: false, pattern: ['^https://\S+$', "Ο σύνδεσμος πρέπει να ξεκινά με https:// / The link must start with https://"], hint: "Ολόκληρος ο σύνδεσμος, π.χ. https://www.instagram.com/... Αν μείνει κενό, δεν εμφανίζεται το εικονίδιο. / The full link, e.g. https://www.instagram.com/... If empty, the icon doesn't show." }
          - { label: "Σύνδεσμος Facebook / Facebook link", name: "facebook_url", widget: "string", required: false, pattern: ['^https://\S+$', "Ο σύνδεσμος πρέπει να ξεκινά με https:// / The link must start with https://"], hint: "Ολόκληρος ο σύνδεσμος, π.χ. https://www.facebook.com/... Αν μείνει κενό, δεν εμφανίζεται το εικονίδιο. / The full link, e.g. https://www.facebook.com/... If empty, the icon doesn't show." }

      - name: forms
        label: "Φόρμα επικοινωνίας / Contact form"
