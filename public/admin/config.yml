# local_backend only activates on localhost — safe to leave on in production
local_backend: true

backend:
  name: github
  repo: greek-house-rotterdam/ghrweb
  branch: main
  base_url: https://ghrweb.enosi-ellinon-ollandias.workers.dev
  # The main-protected ruleset allows only squash merges. Without this,
  # Decap's Publish asks for a merge commit and GitHub rejects it for anyone
  # who can't bypass the ruleset, i.e. every editor.
  squash_merges: true
  # The token an editor gets at login works on public repos only, not on their
  # private ones. That's enough here because this repo is public. Who may edit
  # is still decided by GitHub team permissions and the ruleset.
  auth_scope: public_repo

publish_mode: editorial_workflow

# Production URL (Cloudflare Workers). The "View Preview" link in the editorial
# workflow uses the per-commit preview URL from the `deploy/preview` commit
# status (see .github/workflows/preview-status.yml) plus each collection's
# preview_path.
site_url: https://ghrweb.enosi-ellinon-ollandias.workers.dev
display_url: https://ghrweb.enosi-ellinon-ollandias.workers.dev

media_folder: public/images
public_folder: /images

collections:
  # ── News ──────────────────────────────────────────────────────────

  - name: news-gr
    label: "Νέα (Ελληνικά)"
    # No Publish button: Ready is the only way to publish (auto-publish waits
    # for translations and checks). The admin account may skip the ruleset,
    # so its Publish could merge before the translations exist.
    publish: false
    description: "Γράψε στα ελληνικά. Τα ολλανδικά και τα αγγλικά μεταφράζονται αυτόματα όταν αποθηκεύσεις. / Write in Greek. Dutch and English are translated automatically when you save."
    folder: src/content/news/gr
    # Deleting a published entry commits straight to main and removes only
    # the Greek file (tested on #99). Editors use "Hide from site" instead.
    delete: false
    create: true
    slug: "{{slug}}"
    preview_path: "gr/news/{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Τίτλος / Title", name: "title", widget: "string", pattern: ['^.{0,100}$', "Έως 100 χαρακτήρες / Max 100 characters"] }
      - { label: "Περιγραφή / Description", name: "description", widget: "string", required: false, hint: "Προαιρετικό. Αν το αφήσεις κενό, χρησιμοποιείται η αρχή του κειμένου. / Optional. If you leave it empty, the start of the text is used.", pattern: ['^.{0,200}$', "Έως 200 χαρακτήρες / Max 200 characters"] }
      - { label: "Ημερομηνία / Date", name: "date", widget: "datetime" }
      - { label: "Φωτογραφία / Image", name: "image", widget: "image", required: false, hint: "JPEG, PNG ή WebP. Οι μεγάλες φωτογραφίες μικραίνουν αυτόματα στα 2560 px μετά την αποθήκευση. / Use JPEG, PNG or WebP. Big photos are shrunk to 2560 px automatically after you save." }
      - { label: "Σύντομη διεύθυνση / Short address", name: "url_slug", widget: "string", required: false, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Μόνο λατινικά πεζά γράμματα, αριθμοί και παύλες, π.χ. pascha-2026 / Only lowercase Latin letters, numbers and hyphens, e.g. pascha-2026"], hint: "Προαιρετικό. Λατινικά πεζά γράμματα, αριθμοί και παύλες, π.χ. pascha-2026. Αν μείνει κενό, η διεύθυνση βγαίνει από τον τίτλο. Μην την αλλάξεις αφού μοιραστείς τον σύνδεσμο: η παλιά σύντομη διεύθυνση σταματά να λειτουργεί. / Optional. Lowercase Latin letters, numbers and hyphens, e.g. pascha-2026. If empty, the address comes from the title. Don't change it after you share the link: the old short address stops working." }
      - { label: "Απόκρυψη από τον ιστότοπο / Hide from site", name: "hidden", widget: "boolean", required: false, default: false, hint: "Ενεργοποίησέ το για να φύγει η καταχώρηση από τον ιστότοπο, σε όλες τις γλώσσες, μόλις δημοσιευτεί. Δεν διαγράφεται τίποτα: απενεργοποίησέ το για να ξαναεμφανιστεί. Το κείμενο μένει ορατό στο GitHub: για προσωπικά δεδομένα, ζήτησε από τον διαχειριστή να το σβήσει οριστικά. / Turn on to take this entry off the site in all languages once published. Nothing is deleted: turn it off to bring it back. The text stays visible on GitHub: for personal data, ask the admin to erase it for good." }
      - { label: "Language", name: "lang", widget: "hidden", default: "gr" }
      - { label: "Κείμενο / Body", name: "body", widget: "markdown" }

